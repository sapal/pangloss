<!DOCTYPE html>
<html lang="${source_lang_code}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} | Pangloss</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --paper: #F9F7F2;
            --ink: #1A1A1A;
            --accent: #5A5A40;
            --muted: #8C8A81;
            --highlight: rgba(90, 90, 64, 0.1);
        }
        body { background-color: var(--paper); color: var(--ink); font-family: 'Lora', Georgia, serif; -webkit-font-smoothing: antialiased; height: 100vh; height: 100dvh; display: flex; overflow: hidden; margin: 0; }
        .font-sans { font-family: 'Helvetica Neue', Arial, sans-serif; }
        .text-accent { color: var(--accent); }
        .text-muted { color: var(--muted); }
        .bg-paper { background-color: var(--paper); }
        .bg-ink { background-color: var(--ink); }
        .text-paper { color: var(--paper); }
        .bg-highlight { background-color: var(--highlight); }
        .selection\:bg-highlight *::selection { background-color: var(--highlight); }
        .border-accent { border-color: var(--accent); }
        .ring-accent\/20 { --tw-ring-color: rgba(90, 90, 64, 0.2); }
        
        .drawer { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .drawer.active { transform: translateX(0); }
        .word { position: relative; border-bottom: 2px solid #5A5A40; cursor: help; display: inline; text-underline-offset: 4px; }
        .word:hover .tooltip { display: block; }
        .tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -20px); background: #1A1A1A; color: #F9F7F2; padding: 25px; width: 300px; z-index: 1000; font-size: 0.9rem; font-family: sans-serif; border-radius: 0; box-shadow: 0 15px 45px rgba(0,0,0,0.6); line-height: 1.5; font-style: normal; }
        .text-content { text-align: justify; }
        .text-content h1 { font-size: 2.5rem; font-weight: 900; font-style: italic; margin-bottom: 1rem; line-height: 1.1; }
        .text-content h2 { font-size: 2rem; font-weight: 800; font-style: italic; margin-bottom: 0.75rem; line-height: 1.2; }
        .text-content h3 { font-size: 1.5rem; font-weight: 700; font-style: italic; margin-bottom: 0.5rem; line-height: 1.3; }
        .text-content hr { border-top: 2px solid rgba(90, 90, 64, 0.1); margin: 2.5rem 0; }
        .text-content strong { font-weight: 800; }
        .text-content em { font-style: italic; }

        /* redone layout styles */
        #scrollContainer {
            flex: 1;
            overflow-y: auto;
            min-width: 0;
        }

        #permanentControls {
            display: flex;
            background-color: var(--ink);
            color: var(--paper);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Default (Mobile Portrait) layout */
        @media (max-width: 767px) and (orientation: portrait) {
            body {
                flex-direction: column !important;
            }
            #scrollContainer {
                height: 0;
                flex-grow: 1 !important;
            }
            #permanentControls {
                flex-direction: row !important;
                width: 100% !important;
                height: 76px !important;
                align-items: center !important;
                justify-content: space-between !important;
                padding: 0 16px !important;
                border-top-width: 1px !important;
            }
            #playerButtonsContainer {
                flex-direction: row !important;
                justify-content: flex-end !important;
                gap: 12px !important;
                flex: 1 !important;
            }
            #navButtonsContainer {
                flex-direction: row !important;
                gap: 12px !important;
                align-items: center !important;
            }
            #dictionaryContainer {
                order: -1;
            }
            .dict-label {
                display: inline !important;
            }
            #prevBtn .label-text, #nextBtn .label-text {
                display: none !important;
            }
            #prevBtn::before {
                content: '';
                display: inline-block;
                width: 8px;
                height: 8px;
                border-top: 2px solid currentColor;
                border-left: 2px solid currentColor;
                transform: rotate(-45deg);
                margin-right: -2px;
            }
            #nextBtn::after {
                content: '';
                display: inline-block;
                width: 8px;
                height: 8px;
                border-bottom: 2px solid currentColor;
                border-right: 2px solid currentColor;
                transform: rotate(-45deg);
                margin-left: -2px;
            }
            #playToggle {
                width: 44px !important;
                height: 44px !important;
                order: 2;
            }
            #playToggle svg {
                width: 18px !important;
                height: 18px !important;
            }
        }

        /* Desktop and Mobile Landscape common sidebar layout */
        @media (min-width: 768px), (orientation: landscape) {
            body {
                flex-direction: row !important;
            }
            #scrollContainer {
                height: 100% !important;
            }
            #permanentControls {
                flex-direction: column !important;
                height: 100vh !important;
                height: 100dvh !important;
                align-items: center !important;
                justify-content: space-between !important;
                border-left-width: 1px !important;
                flex-shrink: 0 !important;
            }
            #playerButtonsContainer {
                flex-direction: column !important;
                gap: 24px !important;
                flex: 1 !important;
                justify-content: center !important;
                align-items: center !important;
            }
        }

        /* Desktop specific sidebar style */
        @media (min-width: 768px) {
            #permanentControls {
                width: 280px !important;
                padding: 40px 24px !important;
            }
            #dictionaryContainer {
                width: 100% !important;
            }
            #drawerToggle {
                width: 100% !important;
                justify-content: center !important;
                padding: 12px !important;
            }
            #navButtonsContainer {
                flex-direction: row !important;
                gap: 20px !important;
                align-items: center !important;
            }
            #prevBtn .label-text, #nextBtn .label-text {
                display: inline !important;
            }
            #playToggle {
                width: 60px !important;
                height: 60px !important;
            }
        }

        /* Mobile Landscape specific sidebar style */
        @media (max-width: 960px) and (orientation: landscape) {
            #permanentControls {
                width: 76px !important;
                padding: 24px 8px !important;
            }
            #playerButtonsContainer {
                gap: 16px !important;
            }
            #navButtonsContainer {
                flex-direction: column !important;
                gap: 16px !important;
                align-items: center !important;
            }
            #prevBtn .label-text, #nextBtn .label-text, .dict-label {
                display: none !important;
            }
            #drawerToggle {
                padding: 10px !important;
                border-radius: 50% !important;
            }
            #playToggle {
                width: 44px !important;
                height: 44px !important;
            }
            #playToggle svg {
                width: 18px !important;
                height: 18px !important;
            }
            #prevBtn::before {
                content: '';
                display: inline-block;
                width: 8px;
                height: 8px;
                border-top: 2px solid currentColor;
                border-left: 2px solid currentColor;
                transform: rotate(45deg);
                margin-bottom: -2px;
            }
            #nextBtn::after {
                content: '';
                display: inline-block;
                width: 8px;
                height: 8px;
                border-bottom: 2px solid currentColor;
                border-right: 2px solid currentColor;
                transform: rotate(45deg);
                margin-top: -2px;
            }
            #prevBtn, #nextBtn {
                width: 32px !important;
                height: 32px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body class="bg-paper text-ink font-serif selection:bg-highlight">
    <div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-[1999] opacity-0 pointer-events-none transition-opacity duration-300" id="overlay"></div>
    <div class="drawer fixed right-0 top-0 h-full w-full max-w-[450px] bg-[#F4F1EA] z-[2000] p-[60px_40px] border-l border-ink/10 overflow-y-auto shadow-[-20px_0_60px_rgba(0,0,0,0.2)]" id="drawer">
        <div class="flex justify-between items-start mb-16">
            <h2 class="text-3xl md:text-[44px] italic font-bold font-serif">${lexicon_label}</h2>
            <button id="closeDrawer" class="bg-none border-none cursor-pointer opacity-50 p-2 hover:bg-ink/5 rounded-full transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <div class="mb-16 space-y-8">
            <h4 class="text-[10px] uppercase font-bold tracking-[3px] text-muted border-b border-ink/10 pb-2">${vocabulary_label}</h4>
            <div id="vocabList" class="space-y-6"></div>
        </div>

        <div class="space-y-8">
            <h4 class="text-[10px] uppercase font-bold tracking-[3px] text-muted border-b border-ink/10 pb-2">${cast_label}</h4>
            <div id="castList" class="space-y-8"></div>
        </div>
    </div>

    <!-- Scrollable main text area -->
    <div id="scrollContainer">
        <div id="mainContainer" class="max-w-[1100px] mx-auto px-6 py-12 md:px-12 md:py-20">
            <header class="border-b-2 border-ink/5 pb-[30px] mb-[60px]">
                <h1 class="text-3xl md:text-[3.5rem] m-0 italic font-[900] tracking-[-2px] leading-tight mb-4">${title}</h1>
                <p class="font-sans text-[10px] uppercase tracking-[3px] font-extrabold opacity-60 mt-2 text-accent">Pangloss • Immersive Audiobooks • ${target_lang} ${level}</p>
            </header>

            <div id="story" class="space-y-8"></div>
        </div>
    </div>

    <!-- Permanent Side/Bottom Control Bar -->
    <div id="permanentControls" class="shadow-[0_-10px_30px_rgba(0,0,0,0.15)] md:shadow-[-10px_0_30px_rgba(0,0,0,0.15)] select-none">
        
        <!-- Section 1: Brand / Status (Desktop only) -->
        <div class="hidden md:flex flex-col gap-4 w-full border-b border-white/10 pb-6 mb-6">
            <span class="text-[9px] uppercase tracking-[3px] text-accent font-sans font-bold">Pangloss Reader</span>
            <div class="flex flex-col">
                <span class="text-[8px] uppercase tracking-[3px] opacity-50 font-sans font-bold">${status_label}</span>
                <span id="status" class="text-xs font-bold uppercase tracking-[2px] font-sans mt-2 text-paper truncate">${status_ready_label}</span>
            </div>
        </div>

        <!-- Section 2: Player Controls -->
        <div id="playerButtonsContainer" class="flex">
            <!-- Play/Pause Button -->
            <button class="bg-paper text-ink rounded-full border-none font-bold cursor-pointer flex items-center justify-center transition-transform hover:scale-105" id="playToggle">
                ${play_svg}
            </button>
            
            <!-- Navigation Button Group -->
            <div id="navButtonsContainer" class="flex">
                <button class="bg-none border-none text-muted cursor-pointer font-sans text-[11px] font-bold uppercase tracking-[2px] transition-colors hover:text-paper flex items-center justify-center" id="prevBtn" disabled>
                    <span class="label-text">${back_label}</span>
                </button>
                <button class="bg-none border-none text-muted cursor-pointer font-sans text-[11px] font-bold uppercase tracking-[2px] transition-colors hover:text-paper flex items-center justify-center" id="rewindBtn" title="Rewind 10s">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <text x="12" y="15.5" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="currentColor">10</text>
                    </svg>
                </button>
                <button class="bg-none border-none text-muted cursor-pointer font-sans text-[11px] font-bold uppercase tracking-[2px] transition-colors hover:text-paper flex items-center justify-center" id="nextBtn">
                    <span class="label-text">${next_label}</span>
                </button>
            </div>
        </div>

        <!-- Section 3: Dictionary Button -->
        <div id="dictionaryContainer" class="flex items-center justify-center">
            <button class="border border-white/20 bg-white/5 hover:bg-white/10 px-4 py-2 font-sans text-[10px] font-bold uppercase tracking-[2px] text-paper cursor-pointer flex items-center gap-2 transition-colors rounded" id="drawerToggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg>
                <span class="dict-label">${dictionary_label}</span>
            </button>
        </div>

    </div>

    <audio id="player"></audio>

    <script>
        const metadata = ${metadata_json};
        const audioData = ${audio_data_json};
        const scrollContainer = document.getElementById('scrollContainer');
        const storyEl = document.getElementById('story');
        const playBtn = document.getElementById('playToggle');
        const statusEl = document.getElementById('status');
        const player = document.getElementById('player');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const drawerToggle = document.getElementById('drawerToggle');
        const rewindBtn = document.getElementById('rewindBtn');
        const closeDrawer = document.getElementById('closeDrawer');
        
        let currentId = null;
        let isPlaying = false;

        const PLAY_SVG = ${play_svg_json};
        const PAUSE_SVG = ${pause_svg_json};

        function md(text) {
            if (!text) return "";
            // Headers
            text = text.replace(/^### (.*$$)/gim, '<h3>$$1</h3>');
            text = text.replace(/^## (.*$$)/gim, '<h2>$$1</h2>');
            text = text.replace(/^# (.*$$)/gim, '<h1>$$1</h1>');
            // Rulers
            text = text.replace(/^---+$$|^___+$$/gim, '<hr>');
            // Bold
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$$1</strong>');
            text = text.replace(/__(.*?)__/g, '<strong>$$1</strong>');
            // Italics
            text = text.replace(/\*(.*?)\*/g, '<em>$$1</em>');
            text = text.replace(/_(.*?)_/g, '<em>$$1</em>');
            return text;
        }

        function render() {
            storyEl.innerHTML = metadata.paragraphs.map(p => {
                const speakersList = Array.from(new Set(p.turns.map(t => t.speaker)));
                const speakers = speakersList.length > 0 ? speakersList.join(' • ') : 'Narrator';
                
                const origParas = p.originalText.split('\n\n');
                const transParas = p.translatedText.split('\n\n');
                const maxParas = Math.max(origParas.length, transParas.length);

                const sortedWords = [...metadata.difficultWords].sort((a,b) => b.word.length - a.word.length);

                const alignedContent = Array.from({ length: maxParas }).map((_, i) => {
                    let transPara = transParas[i] || "";
                    sortedWords.forEach(dw => {
                        const anchors = dw.anchors || [dw.word];
                        anchors.forEach(anchor => {
                            const escaped = anchor.replace(/[.*+?^$${}()[\]\\]/g, '\\$$&');
                            const regex = new RegExp("\\b" + escaped + "\\b", 'gi');
                            transPara = transPara.replace(regex, `<span class="word">$$&<div class="tooltip"><strong>$${dw.word}</strong>: $${dw.explanation}</div></span>`);
                        });
                    });

                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start mb-8 last:mb-0">
                            <div id="orig-$${p.id}-$${i}" class="text-base md:text-xl leading-relaxed font-serif opacity-70 transition-all duration-300 text-content">$${md(origParas[i] || "")}</div>
                            <div id="trans-$${p.id}-$${i}" class="text-base md:text-xl leading-relaxed font-serif transition-all duration-300 text-content">$${md(transPara)}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="group/row border-b border-ink/5 pt-12 pb-12 transition-all first:pt-0" id="section-$${p.id}">
                        <div class="flex items-center gap-4 mb-8">
                            <span class="text-[10px] uppercase tracking-[2px] font-bold text-muted border-b border-accent/30 pb-1">$${speakers}</span>
                            <button onclick="playPara($${p.id})" class="w-8 h-8 rounded-full bg-accent/10 flex items-center justify-center hover:bg-accent hover:text-paper transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                        <div id="trans-$${p.id}" onclick="playPara($${p.id})" class="cursor-pointer">
                            $${alignedContent}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('vocabList').innerHTML = metadata.difficultWords.map(dw => `
                <div class="group border-b border-ink/5 pb-6 last:border-0 hover:translate-x-1 transition-transform">
                    <p class="text-2xl font-serif font-bold mb-2">$${dw.word}</p>
                    <p class="text-sm text-ink/70 font-serif italic leading-relaxed">$${dw.explanation}</p>
                </div>
            `).join('');

            document.getElementById('castList').innerHTML = metadata.characters.map(char => `
                <div class="flex gap-6">
                    <div class="w-12 h-12 bg-paper border border-ink/10 rounded-full flex items-center justify-center flex-shrink-0 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5A40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    </div>
                    <div>
                        <p class="text-xl font-serif font-bold mb-1">$${char.name}</p>
                        <p class="text-xs text-ink/60 font-serif italic leading-relaxed mb-3">$${char.description}</p>
                        <div class="flex flex-wrap gap-2">
                            <span class="text-[9px] uppercase tracking-[2px] font-bold px-3 py-1 bg-accent text-paper rounded-full">Voice • $${char.voice}</span>
                            <span class="text-[9px] uppercase tracking-[1px] font-bold px-3 py-1 bg-ink/5 text-ink/70 rounded-full italic hover:bg-ink/10 transition-colors cursor-default">$${char.voiceProfile}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('[id^="section-"]').forEach(el => observer.observe(el));
        }

        function openDrawer() {
            drawer.classList.add('active');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
        }

        if (drawerToggle) drawerToggle.onclick = openDrawer;

        closeDrawer.onclick = overlay.onclick = () => {
            drawer.classList.remove('active');
            overlay.classList.remove('opacity-100', 'pointer-events-auto');
        };

        if (rewindBtn) {
            rewindBtn.onclick = () => {
                if (player && player.src) {
                    player.currentTime = Math.max(0, player.currentTime - 10);
                }
            };
        }

        function scrollToActiveText(smooth = true, force = false) {
            if (currentId === null) return false;
            const p = metadata.paragraphs.find(para => para.id === currentId);
            if (!p) return false;

            const progress = player.duration ? (player.currentTime / player.duration) : 0;
            const origParas = p.originalText.split('\n\n');
            const transParas = p.translatedText.split('\n\n');
            const maxParas = Math.max(origParas.length, transParas.length);

            // Map overall progress to active sub-paragraph index
            const totalLen = origParas.reduce((acc, text) => acc + text.length, 0);
            let cumulativeLen = 0;
            let activeSubIndex = 0;
            if (totalLen > 0) {
                const targetLen = progress * totalLen;
                for (let i = 0; i < origParas.length; i++) {
                    cumulativeLen += origParas[i].length;
                    if (targetLen <= cumulativeLen) {
                        activeSubIndex = i;
                        break;
                    }
                }
            }
            if (activeSubIndex >= maxParas) {
                activeSubIndex = maxParas - 1;
            }

            const transEl = document.getElementById(`trans-$${currentId}-$${activeSubIndex}`);
            if (!transEl) return false;

            // Calculate start/end progress of the active sub-paragraph
            let startLen = 0;
            for (let i = 0; i < activeSubIndex; i++) {
                if (origParas[i]) {
                    startLen += origParas[i].length;
                }
            }
            const activeParaLen = origParas[activeSubIndex] ? origParas[activeSubIndex].length : 0;
            const endLen = startLen + activeParaLen;
            const startProgress = startLen / (totalLen || 1);
            const endProgress = endLen / (totalLen || 1);

            let subProgress = 0;
            if (endProgress > startProgress) {
                subProgress = (progress - startProgress) / (endProgress - startProgress);
                subProgress = Math.max(0, Math.min(1, subProgress));
            }

            const rect = transEl.getBoundingClientRect();
            const containerRect = scrollContainer.getBoundingClientRect();
            
            // Calculate position of the read cursor relative to the scroll container
            const pointY = rect.top - containerRect.top + subProgress * rect.height;

            const margin = 150; // pixels from top/bottom
            if (force || pointY < margin || pointY > scrollContainer.clientHeight - margin) {
                const targetScrollTop = scrollContainer.scrollTop + pointY - scrollContainer.clientHeight / 2;
                scrollContainer.scrollTo({ top: targetScrollTop, behavior: smooth ? 'smooth' : 'auto' });
                return true;
            }
            return false;
        }

        let lastScrollTime = 0;
        player.addEventListener('timeupdate', () => {
            if (!isPlaying || currentId === null) return;
            const now = Date.now();
            if (now - lastScrollTime < 800) return;
            
            const didScroll = scrollToActiveText(true, false);
            if (didScroll) {
                lastScrollTime = now;
            }
        });

        function playPara(id, restart = true) {
            if (restart || player.src !== audioData[id]) {
                player.src = audioData[id];
            }
            currentId = id;
            player.play();
            isPlaying = true;
            updateUI();
        }

        const observer = new IntersectionObserver((entries) => {
            if (isPlaying) return;
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = parseInt(entry.target.id.replace('section-', ''));
                    if (currentId !== id) {
                        currentId = id;
                        updateUI(false);
                    }
                }
            });
        }, { threshold: 0.5 });

        function updateUI(autoScroll = true) {
            document.querySelectorAll('[id^="section-"]').forEach(el => {
                el.classList.remove('bg-accent/5', 'ring-1', 'ring-accent/10', 'shadow-sm', 'p-8', '-mx-8', 'rounded-2xl');
            });
            document.querySelectorAll('[id^="orig-"]').forEach(el => el.classList.add('opacity-40'));

            if (currentId !== null) {
                const section = document.getElementById('section-' + currentId);
                if (section) {
                    section.classList.add('bg-accent/5', 'ring-1', 'ring-accent/10', 'shadow-sm', 'p-8', '-mx-8', 'rounded-2xl');
                    section.querySelectorAll('[id^="orig-"]').forEach(el => el.classList.remove('opacity-40'));
                    if (autoScroll) {
                        scrollToActiveText(true, true);
                    }
                }
                statusEl.innerText = `${chapter_label} ` + currentId;
                if (window.location.hash !== '#section-' + currentId) {
                    history.replaceState(null, null, '#section-' + currentId);
                }
            }
            playBtn.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
            
            const index = metadata.paragraphs.findIndex(p => p.id === currentId);
            prevBtn.disabled = index <= 0;
            nextBtn.disabled = index >= metadata.paragraphs.length - 1 && index !== -1;
        }

        playBtn.onclick = () => {
            if (isPlaying) {
                player.pause();
                isPlaying = false;
            } else {
                if (currentId !== null && player.src === audioData[currentId]) {
                    player.play();
                    isPlaying = true;
                } else {
                    const nextId = currentId !== null ? currentId : metadata.paragraphs[0].id;
                    playPara(nextId);
                }
            }
            updateUI();
        };

        prevBtn.onclick = () => {
            const index = metadata.paragraphs.findIndex(p => p.id === currentId);
            if (index > 0) playPara(metadata.paragraphs[index - 1].id);
        };

        nextBtn.onclick = () => {
            const index = metadata.paragraphs.findIndex(p => p.id === currentId);
            if (index < metadata.paragraphs.length - 1) playPara(metadata.paragraphs[index + 1].id);
        };

        player.onended = () => {
            const index = metadata.paragraphs.findIndex(p => p.id === currentId);
            if (index < metadata.paragraphs.length - 1) {
                playPara(metadata.paragraphs[index + 1].id);
            } else {
                isPlaying = false;
                currentId = null;
                updateUI();
                statusEl.innerText = '${finished_label}';
            }
        };

        window.addEventListener('load', () => {
          render();
          const hash = window.location.hash;
          if (hash.startsWith('#section-')) {
              const id = parseInt(hash.replace('#section-', ''));
              if (!isNaN(id)) currentId = id;
          }
          updateUI(true);
        });
        // Initial render for immediate visibility
        render();
    </script>
</body>
</html>
